services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buddy_feast_db
      POSTGRES_USER: buddy_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy_user -d buddy_feast_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: buddy_feast_db
      DB_USERNAME: buddy_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        BACKEND_URL: http://backend:8080
    environment:
      PORT: 3000
    ports:
      - "3003:3000"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        BACKEND_URL: http://backend:8080
    environment:
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  rider:
    build:
      context: .
      dockerfile: apps/rider/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        BACKEND_URL: http://backend:8080
    environment:
      PORT: 3000
    ports:
      - "3002:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
