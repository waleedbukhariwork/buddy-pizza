# Server
server.port=8080
server.servlet.context-path=/api

# Local secrets override (gitignored — copy application-local.properties.example to get started)
spring.config.import=optional:application-local.properties

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/buddy_feast_db}
spring.datasource.username=${DB_USERNAME:buddy_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.buddyfeast=DEBUG

# Application
spring.application.name=buddy-feast-api

# CORS — comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Resend — transactional email for OTP delivery
# Must be a Resend-verified domain. For testing use: onboarding@resend.dev (delivers only to your account email)
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:Buddy Feast <no-reply@contact.yumzoy.shop>}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
