# Server
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/buddy_feast_db
spring.datasource.username=buddy_user
spring.datasource.password=buddy123@
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=buddy-feast-secret-key-min-256-bits-long-change-in-production-immediately
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.buddyfeast=DEBUG

# Application
spring.application.name=buddy-feast-api

# CORS — comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Cloudinary — replace with your actual credentials from cloudinary.com/console
cloudinary.cloud-name=YOUR_CLOUD_NAME
cloudinary.api-key=YOUR_API_KEY
cloudinary.api-secret=YOUR_API_SECRET

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
