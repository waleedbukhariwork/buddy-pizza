# Buddy Feast — Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec

databases:
  - name: buddy-feast-db
    databaseName: buddy_feast_db
    user: buddy_user
    plan: free
    region: singapore
    ipAllowList: [] # allow only from internal services

services:
  # ── Backend API ────────────────────────────────────────────────────
  - type: web
    name: buddy-feast-api
    runtime: docker
    repo: https://github.com/waleedbukhariwork/buddy-pizza
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    branch: main
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: buddy-feast-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: buddy-feast-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: buddy-feast-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: buddy-feast-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: buddy-feast-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://buddy-feast-customer.onrender.com,https://buddy-feast-admin.onrender.com,https://buddy-feast-rider.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Buddy Feast <no-reply@contact.yumzoy.shop>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    healthCheckPath: /api/v1/products
    autoDeploy: true

  # ── Customer App ───────────────────────────────────────────────────
  - type: web
    name: buddy-feast-customer
    runtime: docker
    repo: https://github.com/waleedbukhariwork/buddy-pizza
    dockerfilePath: ./apps/customer/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: main
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://buddy-feast-api.onrender.com/api
      - key: BACKEND_URL
        value: https://buddy-feast-api.onrender.com
    autoDeploy: true

  # ── Admin App ──────────────────────────────────────────────────────
  - type: web
    name: buddy-feast-admin
    runtime: docker
    repo: https://github.com/waleedbukhariwork/buddy-pizza
    dockerfilePath: ./apps/admin/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: main
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://buddy-feast-api.onrender.com/api
      - key: BACKEND_URL
        value: https://buddy-feast-api.onrender.com
    autoDeploy: true

  # ── Rider App ──────────────────────────────────────────────────────
  - type: web
    name: buddy-feast-rider
    runtime: docker
    repo: https://github.com/waleedbukhariwork/buddy-pizza
    dockerfilePath: ./apps/rider/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: main
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://buddy-feast-api.onrender.com/api
    autoDeploy: true
