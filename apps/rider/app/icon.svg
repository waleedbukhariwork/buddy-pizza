<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Green background circle -->
  <circle cx="16" cy="16" r="15" fill="#16A34A"/>
  <!-- Pizza box body -->
  <rect x="6" y="13" width="20" height="11" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <!-- Box lid -->
  <rect x="6" y="10" width="20" height="5" rx="2" fill="#FCD34D" stroke="#D97706" stroke-width="1.2"/>
  <!-- Box divider line -->
  <line x1="6" y1="14.5" x2="26" y2="14.5" stroke="#D97706" stroke-width="1"/>
  <!-- Speed lines (motion) -->
  <line x1="2" y1="17" x2="6" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="2" y1="20" x2="5" y2="20" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Pizza slice peek -->
  <path d="M13 16 L16 11 L19 16 Z" fill="#F97316" opacity="0.6"/>
</svg>
