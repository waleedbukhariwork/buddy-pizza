<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#1E1B4B"/>
  <!-- Pizza base -->
  <circle cx="16" cy="16" r="11" fill="#F97316"/>
  <!-- Crust ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#C2410C" stroke-width="2"/>
  <!-- Cheese -->
  <circle cx="16" cy="16" r="8" fill="#FCD34D"/>
  <!-- Sauce patches -->
  <circle cx="13" cy="14" r="2" fill="#DC2626" opacity="0.7"/>
  <circle cx="18" cy="13" r="1.6" fill="#DC2626" opacity="0.7"/>
  <circle cx="18" cy="19" r="1.8" fill="#DC2626" opacity="0.7"/>
  <!-- Pepperoni -->
  <circle cx="13" cy="14" r="1.5" fill="#7F1D1D"/>
  <circle cx="18" cy="13" r="1.2" fill="#7F1D1D"/>
  <circle cx="18" cy="19" r="1.4" fill="#7F1D1D"/>
  <!-- Slice lines -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#C2410C" stroke-width="0.7" opacity="0.5"/>
  <line x1="5" y1="16" x2="27" y2="16" stroke="#C2410C" stroke-width="0.7" opacity="0.5"/>
</svg>
