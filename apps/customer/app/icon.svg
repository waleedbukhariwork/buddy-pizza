<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pizza base -->
  <circle cx="16" cy="16" r="15" fill="#F97316"/>
  <!-- Crust ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#C2410C" stroke-width="3"/>
  <!-- Cheese -->
  <circle cx="16" cy="16" r="11" fill="#FCD34D"/>
  <!-- Sauce patches -->
  <circle cx="12" cy="13" r="2.5" fill="#DC2626" opacity="0.7"/>
  <circle cx="18" cy="11" r="2" fill="#DC2626" opacity="0.7"/>
  <circle cx="20" cy="18" r="2.2" fill="#DC2626" opacity="0.7"/>
  <circle cx="12" cy="20" r="1.8" fill="#DC2626" opacity="0.7"/>
  <!-- Pepperoni spots -->
  <circle cx="13" cy="14" r="2" fill="#991B1B"/>
  <circle cx="19" cy="12" r="1.8" fill="#991B1B"/>
  <circle cx="20" cy="19" r="1.9" fill="#991B1B"/>
  <circle cx="12" cy="21" r="1.5" fill="#991B1B"/>
  <!-- Slice cut lines -->
  <line x1="16" y1="1" x2="16" y2="31" stroke="#C2410C" stroke-width="0.8" opacity="0.5"/>
  <line x1="1" y1="16" x2="31" y2="16" stroke="#C2410C" stroke-width="0.8" opacity="0.5"/>
</svg>
